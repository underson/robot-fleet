name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      # Includes the Postgres integration tests: Testcontainers uses the
      # runner's Docker, so CI tests against the same Postgres as compose.
      - name: Test
        run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The UI's types are generated from the backend's OpenAPI spec. If the
      # spec changed without regenerating, the contract drifted: fail here.
      - name: API types match openapi.yaml
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
